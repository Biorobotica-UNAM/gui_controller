# config.yaml
surge:
  commands:
    - "cd ~/Justina"
    - "source install/setup.bash"
    - "ros2 launch surge_et_ambula justina.launch.xml"

supervisor:
  commands:
    - "cd ~/Justina"
    - "source install/setup.bash"
    - "ros2 run supervisor_manager supervisor_manager_node"

planning_profiles:
  - name: "HRI"
    commands:
      - "cd ~/ros2_clips"
      - "source install/setup.bash"
      - "ros2 launch planning_tools planning.launch.xml plan_name:=\"hri\""
  - name: "PNP"
    commands:
      - "cd ~/ros2_clips"
      - "source install/setup.bash"
      - "ros2 launch planning_tools planning.launch.xml plan_name:=\"pnp\""
  - name: "Laundry"
    commands:
      - "cd ~/ros2_clips"
      - "source install/setup.bash"
      - "ros2 launch planning_tools planning.launch.xml plan_name:=\"laundry\""
  - name: "Restaurant"
    commands:
      - "cd ~/ros2_clips"
      - "source install/setup.bash"
      - "ros2 launch planning_tools planning.launch.xml plan_name:=\"restaurant\""
  - name: "Robot Inspection"
    commands:
      - "cd ~/ros2_clips"
      - "source install/setup.bash"
      - "ros2 launch planning_tools planning.launch.xml plan_name:=\"robot_inspection\""