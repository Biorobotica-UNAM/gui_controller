# config.yaml
ros_environment:
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: file:///etc/cyclonedds/cyclonedds.xml
  ROS_DOMAIN_ID: "0"
  ROS_LOCALHOST_ONLY: "0"

aliases:
  justina_ws: "$JUSTINA_WS"

surge:
  commands:
    - "cd \"{justina_ws}\""
    - "ros2 daemon stop && ros2 daemon start"
    - "source install/setup.bash"
    - "ros2 launch surge_et_ambula justina.launch.xml"

surge_simulation:
  commands:
    - "cd \"{justina_ws}\""
    - "ros2 daemon stop && ros2 daemon start"
    - "source install/setup.bash"
    - "ros2 launch surge_et_ambula justina_sim.launch.xml nav_use_point_cloud:=false"

supervisor:
  commands:
    - "cd \"{justina_ws}\""
    - "ros2 daemon stop && ros2 daemon start"
    - "source install/setup.bash"
    - "ros2 run supervisor_manager supervisor_manager_node"

planning_profiles:
  - name: "HRI"
  - name: "PNP Justina"
  - name: "PNP Takeshi"
  - name: "Laundry"
  - name: "Restaurant"
  - name: "Robot Inspection"
  - name: "GPSR"
